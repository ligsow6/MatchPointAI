name: Rafraîchissement des données

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "fixtures/**"
      - "pyproject.toml"
      - ".github/workflows/refresh-data.yml"

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Pipeline complet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - run: python -m pipeline --refresh
      - name: Vérification du modèle exécuté par onnxruntime-web
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Publication des fichiers modifiés
        run: |
          if [ -z "$(git status --porcelain -- web/public/data web/public/model README.md)" ]; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data web/public/model README.md
          git commit -m "chore: met à jour les données ATP"
          git pull --rebase origin main
          git push origin HEAD:main
