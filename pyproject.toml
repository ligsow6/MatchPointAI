[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpoint-pipeline"
version = "1.0.0"
description = "Pipeline de données et de modélisation pour la prédiction de matchs ATP"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "lightgbm>=4.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "exploration"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PL", "PTH", "NPY", "PD"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/*" = ["ANN", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline"]

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-q"
